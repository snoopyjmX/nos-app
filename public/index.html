<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>NÓS — Um espaço só nosso</title>
    <meta name="description" content="Um espaço só nosso." />
    <meta name="application-name" content="NÓS" />

    <!-- iOS Safari PWA Standalone (Remove guias, barra de URLs e botões do navegador) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NÓS" />

    <!-- Cores do tema para barra de status -->
    <meta name="theme-color" content="#0F0D18" />
    <meta name="msapplication-navbutton-color" content="#0F0D18" />

    <!-- Ícone da Tela de Início no iPhone (Add to Home Screen) -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Web App Manifest & Favicon -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- The `react-native-web` recommended style reset -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        background-color: #0F0D18;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        width: 100%;
        flex: 1;
        background-color: #0F0D18;
      }
      /* Experiência nativa no iPhone Safari */
      * {
        -webkit-tap-highlight-color: transparent;
      }
      html, body, #root {
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        overscroll-behavior-y: none;
      }
      input, textarea {
        user-select: auto;
        -webkit-user-select: auto;
      }
    </style>
  </head>

  <body>
    <noscript>
      Você precisa ativar o JavaScript para executar este aplicativo.
    </noscript>
    <div id="root"></div>
  </body>
</html>
