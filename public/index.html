<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>nós. — Um espaço só nosso</title>
    <meta name="description" content="Um espaço íntimo e afetuoso para guardar memórias, recados e datas do casal." />
    <meta name="application-name" content="nós." />

    <!-- iOS Safari PWA Standalone -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- 'default' garante status bar nativa com texto escuro e sem degradê preto no topo do iPhone -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="nós." />

    <!-- Cor da barra de status sincronizada com o fundo do app (sem barra preta em modo escuro do sistema) -->
    <meta name="theme-color" content="#F8F9FC" />

    <!-- Ícones para iOS Add to Home Screen e PWA com novo arquivo v5 garantindo limpeza de cache -->
    <link rel="apple-touch-icon" href="/apple-touch-icon-v5.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v5.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon.png" />
    <link rel="icon" type="image/png" href="/apple-touch-icon-v5.png" />
    <link rel="manifest" href="/manifest.json" />

    <style id="expo-reset">
      :root {
        --app-bg: #F8F9FC;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --app-bg: #0F0D18;
        }
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        background-color: var(--app-bg);
        overflow: hidden;
      }

      #root {
        display: flex;
        height: 100%;
        width: 100%;
        flex: 1;
        background-color: var(--app-bg);
      }

      html, body, #root {
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        overscroll-behavior-y: none;
      }

      /* Garante contraste e visibilidade de inputs no Safari iOS e Android Chrome */
      input, textarea {
        user-select: auto;
        -webkit-user-select: auto;
      }

      input::placeholder,
      textarea::placeholder {
        color: #8A879A !important;
        opacity: 1 !important;
        -webkit-text-fill-color: #8A879A !important;
      }
    </style>
  </head>

  <body>
    <noscript>
      Você precisa ativar o JavaScript para executar este aplicativo.
    </noscript>
    <div id="root"></div>
  </body>
</html>
